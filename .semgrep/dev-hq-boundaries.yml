# Dev HQ architectural boundary rules.
#
# These encode invariants that are otherwise enforced only by prose in the
# Master Roadmap and by a reviewer noticing. A rule here fails the build, which
# means the invariant survives reviewer turnover, model changes, and fatigue.
#
# Scope discipline: keep this file small and precise. A noisy rule set gets
# muted, and a muted rule set enforces nothing. Prefer a rule that catches a
# real class of defect over a rule that catches a style preference.
#
# Note on what this file CANNOT do: Semgrep matches code patterns. It cannot
# enforce "only certain people may change these files" — that is CODEOWNERS
# plus branch protection with required code-owner review.

rules:
  - id: dev-hq-internal-route-missing-guard
    languages: [typescript]
    severity: ERROR
    message: >-
      This internal Dev HQ route handler does not ENFORCE rejectInternalDevRequest().
      Routes under app/api/dev-hq/internal/ are Trigger.dev worker callbacks: they
      must be blocked in production and token-authenticated in development. A
      handler without the guard is an unauthenticated write path into the
      execution pipeline. Bind rejectInternalDevRequest(request) as the FIRST
      statement of the body, and return its result on the VERY NEXT statement:

        const rejected = rejectInternalDevRequest(request);
        if (rejected) return rejected;

      Anything between those two lines runs before the request has been
      authenticated, so calling the guard there is not enforcing it.
    paths:
      include:
        # Anchored per Semgrepignore v2 / gitignore semantics. Unanchored
        # patterns are reinterpreted as anchored in a coming release, and the
        # intent here is root-relative, not "any directory named app".
        - "/app/api/dev-hq/internal/**/route.ts"
    patterns:
      # Function declarations and const-arrow exports, async or not. Next.js
      # accepts all four shapes; matching only `export async function` left
      # three ways to write an unguarded handler that this rule could not see.
      #
      # The request parameter is matched as a BARE metavariable, with no type
      # annotation required. Requiring `Request` or `NextRequest` meant
      # `export async function POST(request) { ... }` was not a route handler as
      # far as this rule was concerned -- so deleting one type annotation was a
      # complete, one-token bypass of the guard requirement, and the resulting
      # unguarded handler was invisible rather than merely unflagged. A bare
      # $REQ matches annotated and unannotated parameters alike, which makes the
      # annotation irrelevant to coverage instead of load-bearing for it.
      #
      # $REQ is still BOUND rather than absorbed into `...`, because it is what
      # ties the guard call below to the handler's own request: a handler that
      # guards some other request object is not guarded.
      #
      # The trailing `...` in the parameter list matches the second argument of
      # a dynamic route -- `(request, { params })`. This repository already
      # writes handlers that way (app/api/dev-hq/approvals/[id]/approve/
      # route.ts), so a one-parameter-only rule was blind to a shape already in
      # use here.
      #
      # The zero-parameter branches are not redundant: a handler that accepts no
      # request has nothing to hand the guard, so it cannot be guarded at all.
      # Without these branches it would be exempt for want of a $REQ to bind --
      # unreachable by the rule precisely because it is unguardable.
      - pattern-either:
          - pattern: "export async function $METHOD($REQ, ...) { ... }"
          - pattern: "export async function $METHOD() { ... }"
          - pattern: "export function $METHOD($REQ, ...) { ... }"
          - pattern: "export function $METHOD() { ... }"
          - pattern: "export const $METHOD = async ($REQ, ...) => { ... }"
          - pattern: "export const $METHOD = async () => { ... }"
          - pattern: "export const $METHOD = ($REQ, ...) => { ... }"
          - pattern: "export const $METHOD = () => { ... }"
      - metavariable-regex:
          metavariable: $METHOD
          regex: ^(GET|POST|PUT|PATCH|DELETE|HEAD|OPTIONS)$
      # Three independent requirements, and the ORDER of them is the point:
      #
      #   1. the guard's result is BOUND -- checking only that the identifier
      #      appears lets `rejectInternalDevRequest(request);` pass with the
      #      rejection discarded;
      #   2. the binding is the FIRST statement in the body;
      #   3. the binding is ACTED ON by the VERY NEXT statement.
      #
      # These pattern-nots deliberately do NOT open with `...`, which is what
      # requirement 2 rests on: a leading `...` matches any number of preceding
      # statements, so a guard placed after a database write still satisfied the
      # rule while the message claimed "first statement".
      #
      # Requirement 3 is the one a `...` BETWEEN the binding and the return gave
      # away. This passed, and should not have:
      #
      #     const rejected = rejectInternalDevRequest(request);
      #     await deleteExecution(body.executionId);   // unauthenticated write
      #     if (rejected) return rejected;             // too late
      #
      # The guard is first, its result is bound, and its result is returned --
      # every earlier requirement is met, and the write still went through
      # unauthenticated. Calling a guard is not enforcing it; a rejection
      # returned after the side effect it was meant to prevent has already lost.
      - pattern-not: |
          export async function $METHOD($REQ, ...) {
            $RES = rejectInternalDevRequest($REQ)
            if ($RES) return $RES
            ...
          }
      - pattern-not: |
          export function $METHOD($REQ, ...) {
            $RES = rejectInternalDevRequest($REQ)
            if ($RES) return $RES
            ...
          }
      - pattern-not: |
          export const $METHOD = async ($REQ, ...) => {
            $RES = rejectInternalDevRequest($REQ)
            if ($RES) return $RES
            ...
          }
      - pattern-not: |
          export const $METHOD = ($REQ, ...) => {
            $RES = rejectInternalDevRequest($REQ)
            if ($RES) return $RES
            ...
          }

  # Scoped to the VERIFYING side only. Reading the token in order to SEND it is
  # legitimate and has its own single site; the risk this rule guards against is
  # a second place that decides whether a token is acceptable, because that is
  # what silently duplicates and then weakens the fail-closed comparison.
  - id: dev-hq-internal-token-verified-outside-guard
    languages: [typescript]
    severity: ERROR
    message: >-
      DEV_HQ_INTERNAL_TOKEN is read outside the two files allowed to touch it.
      The token has exactly one comparison site (internal-guard.ts), which fails
      closed when the variable is unset, and one transmission site
      (internal-headers.ts). A third reader is how that fail-closed behaviour
      gets quietly duplicated and then weakened. Import rejectInternalDevRequest
      to verify, or getDevHqInternalHeaders to send.
    paths:
      include:
        - "/app/**"
        - "/lib/**"
        - "/components/**"
        - "/trigger/**"
      exclude:
        # The single comparison site. This is the guard itself.
        - "/lib/dev-hq/internal-guard.ts"
        # The single transmission site: the Trigger worker attaching the token
        # to an outbound server-to-server callback. Not a verification path.
        - "/lib/dev-hq/internal-headers.ts"
        - "**/*.test.ts"
    pattern-either:
      - pattern: process.env.DEV_HQ_INTERNAL_TOKEN
      - pattern: process.env["DEV_HQ_INTERNAL_TOKEN"]
      # Destructuring reaches the same value and read the same way.
      - pattern: const { ..., DEV_HQ_INTERNAL_TOKEN, ... } = process.env
      - pattern: let { ..., DEV_HQ_INTERNAL_TOKEN, ... } = process.env
      # Destructure-with-rename. The binding is called something else from the
      # next line on, which is precisely why the plain destructuring patterns
      # above could not see it -- and renaming is the natural thing to write
      # when the surrounding scope already has a `token` in it.
      - pattern: "const { ..., DEV_HQ_INTERNAL_TOKEN: $ALIAS, ... } = process.env"
      - pattern: "let { ..., DEV_HQ_INTERNAL_TOKEN: $ALIAS, ... } = process.env"
      # process.env reached through an alias. `const env = process.env` then
      # `env.DEV_HQ_INTERNAL_TOKEN` is a single extra line that defeated every
      # pattern anchored on the literal `process.env` receiver. $ENV matches any
      # receiver, so calling the alias anything works. This subsumes the two
      # literal `process.env` patterns above; those are kept because they name
      # the shape a reader expects to find, and Semgrep reports one finding per
      # range regardless of how many patterns in this union matched it.
      - pattern: $ENV.DEV_HQ_INTERNAL_TOKEN
      - pattern: $ENV["DEV_HQ_INTERNAL_TOKEN"]

  # Deliberately a regex rather than a JSX structural pattern: this must behave
  # identically across .ts and .tsx without depending on language-ID handling.
  # ERROR, not WARNING. The scan step runs with --error, which exits non-zero on
  # a finding of ANY severity, so a rule labelled advisory would block the build
  # regardless. The label now matches the behaviour. A reviewed, sanitised use
  # is handled with a `nosemgrep: dev-hq-dangerously-set-inner-html` comment
  # plus the reason, which leaves the exception attributable in the diff.
  - id: dev-hq-dangerously-set-inner-html
    languages: [generic]
    severity: ERROR
    message: >-
      dangerouslySetInnerHTML introduces an XSS sink. Mission Control renders
      agent- and model-produced text, which must be treated as untrusted input.
      Render as text, or sanitise explicitly and document why raw HTML is
      required here.
    paths:
      include:
        - "/app/**"
        - "/components/**"
    pattern-regex: dangerouslySetInnerHTML
