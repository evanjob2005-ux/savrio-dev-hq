name: Pull Request Validation

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull request title
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ -z "$PR_TITLE" ]; then
            echo "::error::Pull request title cannot be empty."
            exit 1
          fi

          if [ ${#PR_TITLE} -lt 10 ]; then
            echo "::error::Pull request title must be at least 10 characters."
            exit 1
          fi

          if echo "$PR_TITLE" | grep -qiE '^(update|changes|fix|stuff|misc)$'; then
            echo "::error::Pull request title is too vague."
            exit 1
          fi

          echo "Pull request title is valid."

      - name: Validate pull request description
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -z "$PR_BODY" ]; then
            echo "::error::Pull request description cannot be empty."
            exit 1
          fi

          if [ ${#PR_BODY} -lt 80 ]; then
            echo "::error::Pull request description must contain meaningful detail."
            exit 1
          fi

          required_sections=(
            "## Summary"
            "## Type of Change"
            "## Changes Made"
            "## Testing"
            "## Checklist"
          )

          missing_sections=0

          for section in "${required_sections[@]}"; do
            if ! grep -Fq "$section" <<< "$PR_BODY"; then
              echo "::error::Missing pull request section: $section"
              missing_sections=1
            fi
          done

          if [ "$missing_sections" -ne 0 ]; then
            exit 1
          fi

          echo "Pull request description is valid."

      - name: Determine changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > changed-files.txt

          changed_count=$(wc -l < changed-files.txt | tr -d ' ')

          echo "count=$changed_count" >> "$GITHUB_OUTPUT"

          echo "Changed files:"
          cat changed-files.txt

      - name: Warn about large pull requests
        shell: bash
        env:
          CHANGED_COUNT: ${{ steps.changes.outputs.count }}
        run: |
          if [ "$CHANGED_COUNT" -gt 50 ]; then
            echo "::warning::This pull request changes more than 50 files. Consider splitting it into smaller pull requests."
          else
            echo "Pull request size is within the recommended range."
          fi

      - name: Detect sensitive file changes
        shell: bash
        run: |
          sensitive_patterns=(
            ".github/workflows/"
            ".github/CODEOWNERS"
            "SECURITY.md"
            "supabase/"
            "migrations/"
            "package.json"
            "package-lock.json"
            "pnpm-lock.yaml"
            "yarn.lock"
            ".env"
            "auth"
            "middleware"
          )

          sensitive_changes=0

          while IFS= read -r file; do
            for pattern in "${sensitive_patterns[@]}"; do
              if [[ "$file" == *"$pattern"* ]]; then
                echo "::warning file=$file::Sensitive or high-impact file changed. Additional review may be required."
                sensitive_changes=1
                break
              fi
            done
          done < changed-files.txt

          if [ "$sensitive_changes" -eq 0 ]; then
            echo "No sensitive file changes detected."
          fi

      - name: Detect documentation-only changes
        id: documentation
        shell: bash
        run: |
          docs_only=true

          while IFS= read -r file; do
            case "$file" in
              *.md|*.txt|docs/*|handbooks/*|standards/*|templates/*|workflows/*|playbooks/*|checklists/*|runbooks/*|adr/*|metrics/*|automation/*)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < changed-files.txt

          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"

          if [ "$docs_only" = "true" ]; then
            echo "This is a documentation-only pull request."
          else
            echo "This pull request includes non-documentation changes."
          fi

      - name: Detect unresolved merge conflict markers
        shell: bash
        run: |
          if git grep -n \
            -e '^<<<<<<< ' \
            -e '^=======$' \
            -e '^>>>>>>> ' \
            -- . \
            ':(exclude).github/workflows/pr.yml'; then
            echo "::error::Unresolved Git merge conflict markers were found."
            exit 1
          fi

          echo "No unresolved merge conflict markers found."

      - name: Validate changed YAML files
        shell: bash
        run: |
          yaml_files=$(grep -E '\.(yml|yaml)$' changed-files.txt || true)

          if [ -z "$yaml_files" ]; then
            echo "No changed YAML files."
            exit 0
          fi

          python3 <<'PYTHON'
          from pathlib import Path
          import subprocess
          import yaml

          changed_files = subprocess.check_output(
              ["git", "diff", "--name-only", "${{ github.event.pull_request.base.sha }}", "${{ github.event.pull_request.head.sha }}"],
              text=True,
          ).splitlines()

          failures = []

          for filename in changed_files:
              path = Path(filename)

              if not path.exists():
                  continue

              if path.suffix.lower() not in {".yml", ".yaml"}:
                  continue

              try:
                  with path.open("r", encoding="utf-8") as file:
                      list(yaml.safe_load_all(file))
                  print(f"Valid: {path}")
              except Exception as error:
                  failures.append((path, error))

          if failures:
              for path, error in failures:
                  print(f"::error file={path}::{error}")

              raise SystemExit(1)

          print("All changed YAML files are valid.")
          PYTHON

      - name: Pull request validation summary
        shell: bash
        env:
          CHANGED_COUNT: ${{ steps.changes.outputs.count }}
          DOCS_ONLY: ${{ steps.documentation.outputs.docs_only }}
        run: |
          echo "Pull request validation completed."
          echo "Changed files: $CHANGED_COUNT"
          echo "Documentation only: $DOCS_ONLY"