name: Pull Request Validation

# Validates pull request quality, metadata, scope, and change risk. This
# workflow deliberately focuses on pull-request-specific signals (title, body,
# changed set, prohibited files) and does not repeat the repository-wide checks
# owned by ci.yml, lint.yml, security.yml, or dependencies.yml.

on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
      - reopened
      - ready_for_review

# Least privilege. This workflow only reads repository content and pull request
# metadata. It never checks out or executes untrusted head code with elevated
# rights, and it intentionally does not use pull_request_target.
permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-pull-request:
    name: Validate Pull Request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Determine changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          # All changed paths, including deletions, with rename detection.
          git diff --name-only --diff-filter=ACMRD -M "$BASE_SHA" "$HEAD_SHA" \
            > changed-all.txt || true
          # Only paths that exist at HEAD (added/copied/modified/renamed-to),
          # used for content validation and prohibited-file checks.
          git diff --name-only --diff-filter=ACMR -M "$BASE_SHA" "$HEAD_SHA" \
            > changed-content.txt || true

          total_count=$(wc -l < changed-all.txt | tr -d '[:space:]')
          content_count=$(wc -l < changed-content.txt | tr -d '[:space:]')

          # Insertions / deletions across the diff.
          shortstat=$(git diff --shortstat "$BASE_SHA" "$HEAD_SHA" || true)
          insertions=$(grep -oE '[0-9]+ insertion' <<< "$shortstat" | grep -oE '[0-9]+' || echo 0)
          deletions=$(grep -oE '[0-9]+ deletion' <<< "$shortstat" | grep -oE '[0-9]+' || echo 0)
          insertions=${insertions:-0}
          deletions=${deletions:-0}

          {
            echo "total_count=${total_count}"
            echo "content_count=${content_count}"
            echo "insertions=${insertions}"
            echo "deletions=${deletions}"
          } >> "$GITHUB_OUTPUT"

          echo "Changed files (${total_count}):"
          cat changed-all.txt

      - name: Reject empty pull requests
        env:
          TOTAL_COUNT: ${{ steps.changes.outputs.total_count }}
        run: |
          set -euo pipefail
          if [[ "${TOTAL_COUNT}" -eq 0 ]]; then
            echo "::error::This pull request does not change any files."
            exit 1
          fi
          echo "Pull request changes ${TOTAL_COUNT} file(s)."

      - name: Validate pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_TITLE// }" ]]; then
            echo "::error::Pull request title cannot be empty."
            exit 1
          fi

          if [[ "${#PR_TITLE}" -lt 10 ]]; then
            echo "::error::Pull request title must be at least 10 characters."
            exit 1
          fi

          if [[ "${#PR_TITLE}" -gt 100 ]]; then
            echo "::warning::Pull request title is longer than 100 characters. Consider shortening it."
          fi

          shopt -s nocasematch
          if [[ "$PR_TITLE" =~ ^(update|updates|changes|change|fix|fixes|stuff|misc|wip)$ ]]; then
            echo "::error::Pull request title is too vague: '${PR_TITLE}'."
            exit 1
          fi
          shopt -u nocasematch

          echo "Pull request title is valid."

      - name: Validate pull request description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail

          if [[ -z "${PR_BODY// }" ]]; then
            echo "::error::Pull request description cannot be empty."
            exit 1
          fi

          if [[ "${#PR_BODY}" -lt 80 ]]; then
            echo "::error::Pull request description must contain meaningful detail (at least 80 characters)."
            exit 1
          fi

          required_sections=(
            "## Summary"
            "## Type of Change"
            "## Changes Made"
            "## Testing"
            "## Checklist"
          )

          missing=0
          for section in "${required_sections[@]}"; do
            if ! grep -Fq "$section" <<< "$PR_BODY"; then
              echo "::error::Missing required pull request section: ${section}"
              missing=1
            fi
          done
          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

          # Unresolved placeholders are surfaced as warnings, not failures.
          if grep -qE '\b(TODO|TBD|FIXME|XXX)\b' <<< "$PR_BODY"; then
            echo "::warning::Pull request description contains unresolved placeholders (TODO/TBD/FIXME/XXX)."
          fi

          echo "Pull request description is valid."

      - name: Warn about pull request size
        env:
          TOTAL_COUNT: ${{ steps.changes.outputs.total_count }}
          INSERTIONS: ${{ steps.changes.outputs.insertions }}
          DELETIONS: ${{ steps.changes.outputs.deletions }}
        run: |
          set -euo pipefail
          changed_lines=$((INSERTIONS + DELETIONS))

          if [[ "${TOTAL_COUNT}" -gt 50 ]]; then
            echo "::warning::This pull request changes ${TOTAL_COUNT} files. Consider splitting it."
          fi
          if [[ "${changed_lines}" -gt 1000 ]]; then
            echo "::warning::This pull request changes ${changed_lines} lines. Consider splitting it."
          fi
          echo "Files: ${TOTAL_COUNT}, lines changed: ${changed_lines}."

      - name: Classify documentation-only changes
        id: docs
        run: |
          set -euo pipefail
          docs_only=true

          if [[ ! -s changed-all.txt ]]; then
            docs_only=false
          fi

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              *.md|*.txt|docs/*|handbooks/*|standards/*|templates/*|agents/*|.github/ISSUE_TEMPLATE/*)
                ;;
              *)
                docs_only=false
                break
                ;;
            esac
          done < changed-all.txt

          echo "docs_only=${docs_only}" >> "$GITHUB_OUTPUT"
          if [[ "$docs_only" == "true" ]]; then
            echo "Documentation-only pull request."
          else
            echo "Pull request includes non-documentation changes."
          fi

      - name: Detect prohibited files
        run: |
          set -euo pipefail

          # Files that must never be committed. Matching is anchored to the
          # path so a legitimate ".env.example" is allowed while ".env" is not.
          prohibited=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            base=$(basename -- "$file")
            reason=""

            case "$file" in
              */node_modules/*|node_modules/*) reason="committed dependencies (node_modules)";;
              .next/*|dist/*|out/*|build/*|coverage/*) reason="committed build output";;
            esac

            case "$base" in
              .env|.env.*)
                case "$base" in
                  .env.example|.env.sample|.env.template) ;;
                  *) reason="environment file";;
                esac
                ;;
              id_rsa|id_dsa|id_ecdsa|id_ed25519) reason="private key file";;
              *.pem|*.key|*.p12|*.pfx|*.keystore|*.jks) reason="private key or certificate file";;
            esac

            if [[ -n "$reason" ]]; then
              echo "::error file=${file}::Prohibited file (${reason}) must not be committed."
              prohibited=1
            fi
          done < changed-content.txt

          if [[ "$prohibited" -ne 0 ]]; then
            exit 1
          fi
          echo "No prohibited files detected."

      - name: Detect sensitive file changes
        run: |
          set -euo pipefail

          sensitive_patterns=(
            ".github/workflows/"
            ".github/CODEOWNERS"
            "SECURITY.md"
            "package.json"
            "package-lock.json"
            "next.config.ts"
            "tsconfig.json"
            "middleware"
            "auth"
          )

          flagged=0
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            for pattern in "${sensitive_patterns[@]}"; do
              if [[ "$file" == *"$pattern"* ]]; then
                echo "::warning file=${file}::Sensitive or high-impact file changed; extra review recommended."
                flagged=1
                break
              fi
            done
          done < changed-all.txt

          if [[ "$flagged" -eq 0 ]]; then
            echo "No sensitive file changes detected."
          fi

      - name: Detect merge conflict markers and whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # git diff --check reports leftover conflict markers and whitespace
          # errors in the diff, and handles binary and deleted files safely.
          if ! git diff --check "$BASE_SHA" "$HEAD_SHA"; then
            echo "::error::Merge conflict markers or whitespace errors were found in the changed lines."
            exit 1
          fi
          echo "No conflict markers or whitespace errors in changed lines."

      - name: Validate changed structured and Markdown files
        run: |
          set -euo pipefail
          python <<'PYTHON'
          import json
          import os
          import re
          import sys

          # PyYAML is installed by an earlier step. A missing parser is a hard
          # failure -- required validation is never silently skipped.
          try:
              import yaml
          except ImportError:
              print("::error::PyYAML is not available; cannot validate changed YAML files.")
              raise SystemExit(1)

          with open("changed-content.txt", "r", encoding="utf-8") as handle:
              files = [line.strip() for line in handle if line.strip()]

          failures = []
          checked = {"yaml": 0, "json": 0, "markdown": 0}

          for name in files:
              if not os.path.isfile(name):
                  continue
              lower = name.lower()
              try:
                  if lower.endswith((".yml", ".yaml")):
                      checked["yaml"] += 1
                      with open(name, "r", encoding="utf-8") as handle:
                          list(yaml.safe_load_all(handle))
                  elif lower.endswith(".json"):
                      checked["json"] += 1
                      with open(name, "r", encoding="utf-8") as handle:
                          json.load(handle)
                  elif lower.endswith(".md"):
                      checked["markdown"] += 1
                      # utf-8-sig strips an optional leading byte-order mark.
                      # With plain utf-8 the BOM survives as U+FEFF at index 0,
                      # so a fence opening on line 1 no longer matches the
                      # line-anchored pattern below: a balanced file was
                      # rejected and an unbalanced one accepted. Three tracked
                      # documents carry a BOM. utf-8-sig is a superset of utf-8
                      # for BOM-less input, so nothing else changes.
                      with open(name, "r", encoding="utf-8-sig") as handle:
                          text = handle.read()
                      # Count fence lines rather than a byte sequence. The
                      # previous text.count("\n```") required a preceding
                      # newline, so it missed a fence opening on line 1, and it
                      # required the fence at column 0, so it missed indented
                      # fences entirely. That could both fail a balanced file
                      # and pass an unbalanced one. Policy, severity and error
                      # message are unchanged.
                      fences = len(re.findall(r"(?m)^[ \t]*```", text))
                      if fences % 2 != 0:
                          raise ValueError("Unbalanced Markdown code fences (```).")
              except Exception as error:  # noqa: BLE001 - report all validation errors
                  failures.append((name, error))

          for name, error in failures:
              print(f"::error file={name}::{error}")

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as handle:
                  handle.write(
                      "## Changed File Validation\n\n"
                      f"- YAML: {checked['yaml']} | JSON: {checked['json']} | "
                      f"Markdown: {checked['markdown']}\n"
                      f"- Invalid files: {len(failures)}\n"
                  )

          if failures:
              sys.exit(1)
          print("Changed structured and Markdown files are valid.")
          PYTHON

      - name: Pull request summary
        if: always()
        env:
          TOTAL_COUNT: ${{ steps.changes.outputs.total_count }}
          INSERTIONS: ${{ steps.changes.outputs.insertions }}
          DELETIONS: ${{ steps.changes.outputs.deletions }}
          DOCS_ONLY: ${{ steps.docs.outputs.docs_only }}
        run: |
          set -euo pipefail
          {
            echo "## Pull Request Validation"
            echo ""
            echo "- Files changed: ${TOTAL_COUNT:-unknown}"
            echo "- Lines: +${INSERTIONS:-0} / -${DELETIONS:-0}"
            echo "- Documentation only: ${DOCS_ONLY:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
