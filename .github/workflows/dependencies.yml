name: Dependencies

# Validates dependency health for the ecosystems that actually exist in this
# repository (npm and GitHub Actions). It is the single owner of dependency
# scanning in the suite: manifest and lockfile consistency, package-manager
# conflict detection, vulnerability auditing, and pull request dependency
# review.
#
# It degrades gracefully in the documentation-first case where no application
# manifests are present -- but "gracefully" stops at the lockfile. A repository
# with a package.json and no package-lock.json has a dependency tree that
# nothing here can inspect, and both controls now fail closed on that state
# instead of reporting health they did not measure.

on:
  push:
    branches:
      - main
      - feature/dev-hq-operating-system
  pull_request:
    branches:
      - main
      - feature/dev-hq-operating-system
  schedule:
    # Weekly, Mondays at 07:00 UTC (offset from the security scan).
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-health:
    name: Manifest and Lockfile Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect ecosystems and validate lockfiles
        run: |
          set -euo pipefail

          errors=0

          has() { [[ -f "$1" ]]; }

          npm_manifest=false;  has package.json     && npm_manifest=true
          npm_lock=false;      has package-lock.json && npm_lock=true
          pnpm_lock=false;     has pnpm-lock.yaml    && pnpm_lock=true
          yarn_lock=false;     has yarn.lock         && yarn_lock=true

          python_manifest=false
          if has requirements.txt || has pyproject.toml || has Pipfile; then
            python_manifest=true
          fi
          docker=false; has Dockerfile && docker=true

          echo "npm manifest:  ${npm_manifest}"
          echo "npm lockfile:  ${npm_lock}"
          echo "pnpm lockfile: ${pnpm_lock}"
          echo "yarn lockfile: ${yarn_lock}"
          echo "python:        ${python_manifest}"
          echo "docker:        ${docker}"

          # Multiple JavaScript package managers must not coexist.
          js_locks=0
          [[ "$npm_lock" == "true" ]]  && js_locks=$((js_locks + 1))
          [[ "$pnpm_lock" == "true" ]] && js_locks=$((js_locks + 1))
          [[ "$yarn_lock" == "true" ]] && js_locks=$((js_locks + 1))
          if [[ "$js_locks" -gt 1 ]]; then
            echo "::error::Multiple JavaScript lockfiles detected; use a single package manager."
            errors=1
          fi

          # A manifest present with npm MUST have its lockfile committed. This
          # was a ::warning:: and exited 0, which is the failure mode this
          # whole job exists to prevent: without a lockfile there is no
          # resolved dependency tree to check, so "Manifest and Lockfile
          # Health" reported healthy having verified nothing about the
          # lockfile it is named after. Absence of the evidence fails closed.
          if [[ "$npm_manifest" == "true" && "$npm_lock" == "false" \
                && "$pnpm_lock" == "false" && "$yarn_lock" == "false" ]]; then
            echo "::error::package.json is present but no lockfile was found. There is no resolved dependency tree to validate, so this control cannot evaluate and fails closed. Commit package-lock.json."
            errors=1
          fi

          # A lockfile without a manifest is unexpected.
          if [[ "$npm_lock" == "true" && "$npm_manifest" == "false" ]]; then
            echo "::error::package-lock.json exists without a package.json."
            errors=1
          fi

          {
            echo "## Dependency Ecosystems"
            echo ""
            echo "| Ecosystem | Present |"
            echo "| --- | --- |"
            echo "| npm (package.json) | ${npm_manifest} |"
            echo "| npm lockfile | ${npm_lock} |"
            echo "| pnpm lockfile | ${pnpm_lock} |"
            echo "| yarn lockfile | ${yarn_lock} |"
            echo "| Python | ${python_manifest} |"
            echo "| Docker | ${docker} |"
            echo "| GitHub Actions | true |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$errors" -ne 0 ]]; then
            exit 1
          fi

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs on pull requests as well as push and schedule. It previously skipped
    # pull requests on the reasoning that dependency-review covered them; that
    # reasoning was wrong, because the two jobs test different properties.
    # dependency-review inspects only the vulnerabilities a diff INTRODUCES,
    # while this job asserts a property of the WHOLE tree. Skipping it on pull
    # requests meant the proof closing an obligation ran only after merge, so
    # the gate was never bound to the candidate it was supposed to gate.
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Require a lockfile to audit
        id: detect
        run: |
          set -euo pipefail
          # A missing lockfile used to set npm=false, which skipped every
          # remaining step and left the job GREEN. "npm Audit" then reported
          # success having audited nothing -- and it is in the release
          # workflow's required-check set, so a deleted lockfile silently
          # satisfied the release gate. Per STD-CTRL-001 rule 5 this exits with
          # the distinct "could not evaluate" status and says what it could not
          # do, rather than reporting a clean audit.
          if [[ ! -f package-lock.json ]]; then
            echo "::error::No package-lock.json found. npm audit has no resolved dependency tree to audit, so this control could not evaluate. It fails closed rather than reporting a clean audit."
            {
              echo "## npm Audit"
              echo ""
              echo "- Scanner status: **NOT EVALUATED** (no package-lock.json)"
              echo "- Policy: **not evaluated** — failing closed"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 2
          fi
          echo "package-lock.json present; auditing the resolved tree."

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm

      - name: Record bundled toolchain versions
        # Records the setup-node-provided binaries that execute the audit. The
        # lockfile is maintained by bundled npm, so no global npm replacement
        # is needed before this control runs.
        run: |
          node --version
          npm --version

      - name: Run npm audit
        run: |
          set -euo pipefail

          # Capture the real npm audit exit code. npm exits non-zero both when
          # vulnerabilities are found (a valid report) and when the scanner
          # itself fails (registry outage, auth error, malformed output). The
          # two cases are distinguished below by inspecting the JSON AND by
          # checking the exit code against its declared domain, so a scanner
          # failure can never be interpreted as a clean audit.
          #
          # --audit-level=low is passed explicitly to PIN that domain. npm's
          # exit code is 1 when findings at or above the audit level exist and
          # 0 otherwise; leaving the level implicit would make the code depend
          # on an npm default, and a code cross-checked against a moving
          # threshold cannot be validated at all.
          audit_exit=0
          npm audit --json --audit-level=low > audit.json 2> audit.err || audit_exit=$?
          export AUDIT_EXIT="$audit_exit"
          echo "npm audit exited with code ${audit_exit}."

          python <<'PYTHON'
          import json
          import os
          import sys

          exit_code = os.environ.get("AUDIT_EXIT", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          def write_summary(lines):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(lines) + "\n")

          def fail_scanner(reason):
              # Exit 2 -- "could not evaluate" -- is deliberately distinct from
              # the exit 1 used for a policy violation (STD-CTRL-001 rule 5),
              # so a broken scanner is never read as a satisfied control.
              print(f"::error::npm audit scanner failure: {reason}")
              write_summary([
                  "## npm Audit",
                  "",
                  f"- Scanner status: **FAILED** ({reason})",
                  f"- npm audit exit code: {exit_code}",
                  "- Policy: **not evaluated** — failing closed",
              ])
              sys.exit(2)

          # The exit code was previously recorded and then never examined, so
          # ANY code npm returned was carried forward as though the run were
          # ordinary. With --audit-level=low pinned above, the domain of
          # `npm audit --json` is exactly {0, 1}. Anything else -- 127 for a
          # missing binary, 134 for a crash, an npm-internal usage error -- is
          # a scanner that did not run as specified, and the JSON it may have
          # left behind is not a report about this dependency tree.
          try:
              audit_exit = int(exit_code)
          except (TypeError, ValueError):
              fail_scanner(f"exit code '{exit_code}' is not an integer")
          if audit_exit not in (0, 1):
              fail_scanner(
                  f"exit code {audit_exit} is outside the documented domain of "
                  "`npm audit --json --audit-level=low`, which returns 0 when "
                  "nothing at or above 'low' was found and 1 when something "
                  "was. An unexpected code means the auditor did not complete "
                  "as specified and its output is not a verdict.")

          # A missing or unparseable report is a scanner failure, not "clean".
          try:
              with open("audit.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, ValueError) as error:
              fail_scanner(f"could not read or parse audit.json ({error})")

          if not isinstance(report, dict):
              fail_scanner("report is not a JSON object")
          # npm surfaces registry/network/auth problems under an "error" key.
          if report.get("error"):
              fail_scanner(f"npm reported an error object: {report['error']}")

          metadata = report.get("metadata")
          if not isinstance(metadata, dict):
              fail_scanner("report is missing the metadata object")
          vulns = metadata.get("vulnerabilities")
          if not isinstance(vulns, dict):
              fail_scanner("report is missing metadata.vulnerabilities")

          order = ["critical", "high", "moderate", "low", "info"]
          for level in order:
              if not isinstance(vulns.get(level), int):
                  fail_scanner(f"vulnerability count for '{level}' is missing or non-numeric")

          counts = {level: vulns[level] for level in order}
          critical = counts["critical"]
          high = counts["high"]

          # The exit code and the report must agree. With --audit-level=low,
          # exit 0 asserts nothing at low or above was found; a report that
          # simultaneously lists findings at low or above contradicts that, and
          # one of the two is wrong. Reading the counts alone would trust a
          # report the scanner's own status says is not about this tree.
          at_or_above_low = sum(counts[level] for level in
                                ("critical", "high", "moderate", "low"))
          if audit_exit == 0 and at_or_above_low > 0:
              fail_scanner(
                  f"exit code 0 asserts nothing at or above 'low' was found, "
                  f"but the report lists {at_or_above_low} such "
                  f"vulnerabilities ({critical} critical, {high} high)")
          if audit_exit == 1 and at_or_above_low == 0:
              fail_scanner(
                  "exit code 1 asserts findings at or above 'low', but the "
                  "report lists none; the report does not describe the run "
                  "that produced this exit code")
          # Security policy: High and Critical block production readiness.
          policy_pass = (critical + high) == 0

          for level in order:
              if counts[level]:
                  marker = "error" if level in ("critical", "high") else "warning"
                  print(f"::{marker}::npm audit found {counts[level]} {level} vulnerabilities.")

          write_summary([
              "## npm Audit",
              "",
              "- Scanner status: **succeeded**",
              f"- npm audit exit code: {exit_code}",
              f"- Critical: {critical}",
              f"- High: {high}",
              f"- Policy (block on High or Critical): {'PASS' if policy_pass else 'FAIL'}",
              "",
              "| Severity | Count |",
              "| --- | --- |",
              *[f"| {level} | {counts[level]} |" for level in order],
          ])

          if not policy_pass:
              print(f"::error::npm audit policy failed: {critical} critical, {high} high.")
              sys.exit(1)
          print("npm audit passed: no high or critical vulnerabilities.")
          PYTHON

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block pull requests that introduce high or critical vulnerabilities.
          fail-on-severity: high
          # No pull-requests: write permission is granted, so do not comment.
          comment-summary-in-pr: never
