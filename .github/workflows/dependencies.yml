name: Dependencies

# Validates dependency health for the ecosystems that actually exist in this
# repository (npm and GitHub Actions). It is the single owner of dependency
# scanning in the suite: manifest and lockfile consistency, package-manager
# conflict detection, vulnerability auditing, and pull request dependency
# review. It degrades gracefully in the documentation-first case where no
# application manifests are present.

on:
  push:
    branches:
      - main
      - feature/dev-hq-operating-system
  pull_request:
    branches:
      - main
      - feature/dev-hq-operating-system
  schedule:
    # Weekly, Mondays at 07:00 UTC (offset from the security scan).
    - cron: "0 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  manifest-health:
    name: Manifest and Lockfile Health
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect ecosystems and validate lockfiles
        run: |
          set -euo pipefail

          errors=0

          has() { [[ -f "$1" ]]; }

          npm_manifest=false;  has package.json     && npm_manifest=true
          npm_lock=false;      has package-lock.json && npm_lock=true
          pnpm_lock=false;     has pnpm-lock.yaml    && pnpm_lock=true
          yarn_lock=false;     has yarn.lock         && yarn_lock=true

          python_manifest=false
          if has requirements.txt || has pyproject.toml || has Pipfile; then
            python_manifest=true
          fi
          docker=false; has Dockerfile && docker=true

          echo "npm manifest:  ${npm_manifest}"
          echo "npm lockfile:  ${npm_lock}"
          echo "pnpm lockfile: ${pnpm_lock}"
          echo "yarn lockfile: ${yarn_lock}"
          echo "python:        ${python_manifest}"
          echo "docker:        ${docker}"

          # Multiple JavaScript package managers must not coexist.
          js_locks=0
          [[ "$npm_lock" == "true" ]]  && js_locks=$((js_locks + 1))
          [[ "$pnpm_lock" == "true" ]] && js_locks=$((js_locks + 1))
          [[ "$yarn_lock" == "true" ]] && js_locks=$((js_locks + 1))
          if [[ "$js_locks" -gt 1 ]]; then
            echo "::error::Multiple JavaScript lockfiles detected; use a single package manager."
            errors=1
          fi

          # A manifest present with npm should have its lockfile committed.
          if [[ "$npm_manifest" == "true" && "$npm_lock" == "false" \
                && "$pnpm_lock" == "false" && "$yarn_lock" == "false" ]]; then
            echo "::warning::package.json is present but no lockfile was found."
          fi

          # A lockfile without a manifest is unexpected.
          if [[ "$npm_lock" == "true" && "$npm_manifest" == "false" ]]; then
            echo "::error::package-lock.json exists without a package.json."
            errors=1
          fi

          {
            echo "## Dependency Ecosystems"
            echo ""
            echo "| Ecosystem | Present |"
            echo "| --- | --- |"
            echo "| npm (package.json) | ${npm_manifest} |"
            echo "| npm lockfile | ${npm_lock} |"
            echo "| pnpm lockfile | ${pnpm_lock} |"
            echo "| yarn lockfile | ${yarn_lock} |"
            echo "| Python | ${python_manifest} |"
            echo "| Docker | ${docker} |"
            echo "| GitHub Actions | true |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [[ "$errors" -ne 0 ]]; then
            exit 1
          fi

  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependency changes on pull requests are covered by the dependency-review
    # job; this scheduled/push audit avoids duplicating that work.
    if: github.event_name != 'pull_request'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect npm project
        id: detect
        run: |
          set -euo pipefail
          if [[ -f package-lock.json ]]; then
            echo "npm=true" >> "$GITHUB_OUTPUT"
          else
            echo "npm=false" >> "$GITHUB_OUTPUT"
            echo "No package-lock.json found. npm audit will be skipped."
            {
              echo "## npm Audit"
              echo ""
              echo "No npm lockfile present. Skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.npm == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Run npm audit
        if: steps.detect.outputs.npm == 'true'
        run: |
          set -euo pipefail

          # Capture the real npm audit exit code. npm exits non-zero both when
          # vulnerabilities are found (a valid report) and when the scanner
          # itself fails (registry outage, auth error, malformed output). The
          # two cases are distinguished below by inspecting the JSON, so a
          # scanner failure can never be interpreted as a clean audit.
          audit_exit=0
          npm audit --json > audit.json 2> audit.err || audit_exit=$?
          export AUDIT_EXIT="$audit_exit"
          echo "npm audit exited with code ${audit_exit}."

          # Production-only pass, so an advisory that ships can be distinguished
          # from one that exists solely in the build toolchain. A failure here is
          # non-fatal: the policy below treats a missing prod report as "cannot
          # prove dev-only", which is the conservative direction.
          npm audit --omit=dev --json > audit-prod.json 2> audit-prod.err || true

          python <<'PYTHON'
          import datetime
          import json
          import os
          import sys

          exit_code = os.environ.get("AUDIT_EXIT", "unknown")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")

          def write_summary(lines):
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as handle:
                      handle.write("\n".join(lines) + "\n")

          def fail_scanner(reason):
              print(f"::error::npm audit scanner failure: {reason}")
              write_summary([
                  "## npm Audit",
                  "",
                  f"- Scanner status: **FAILED** ({reason})",
                  f"- npm audit exit code: {exit_code}",
                  "- Policy: **not evaluated** — failing closed",
              ])
              sys.exit(1)

          # A missing or unparseable report is a scanner failure, not "clean".
          try:
              with open("audit.json", "r", encoding="utf-8") as handle:
                  report = json.load(handle)
          except (OSError, ValueError) as error:
              fail_scanner(f"could not read or parse audit.json ({error})")

          if not isinstance(report, dict):
              fail_scanner("report is not a JSON object")
          # npm surfaces registry/network/auth problems under an "error" key.
          if report.get("error"):
              fail_scanner(f"npm reported an error object: {report['error']}")

          metadata = report.get("metadata")
          if not isinstance(metadata, dict):
              fail_scanner("report is missing the metadata object")
          vulns = metadata.get("vulnerabilities")
          if not isinstance(vulns, dict):
              fail_scanner("report is missing metadata.vulnerabilities")

          order = ["critical", "high", "moderate", "low", "info"]
          for level in order:
              if not isinstance(vulns.get(level), int):
                  fail_scanner(f"vulnerability count for '{level}' is missing or non-numeric")

          counts = {level: vulns[level] for level in order}
          critical = counts["critical"]
          high = counts["high"]

          # ---- Accepted-exception policy -------------------------------------
          # A blanket "block on high or critical" gate is only honest while every
          # high and critical is fixable. Here they are not: npm offers a "fix"
          # for each one that is a MAJOR DOWNGRADE (Next 16 -> 9, Trigger.dev
          # 4.5 -> 1.0), which would break the application to satisfy a scanner.
          # So the gate accepts a dated, reasoned exception list and fails on:
          #   * any critical/high NOT on the list           (something new)
          #   * any exception past its expiry               (stale acceptance)
          #   * any exception no longer matching an advisory (stale entry)
          # The result still fails closed; it just fails on new risk instead of
          # on a permanent backlog nobody can action.
          EXCEPTIONS_PATH = ".github/audit-exceptions.json"

          try:
              with open(EXCEPTIONS_PATH, "r", encoding="utf-8") as handle:
                  accepted_doc = json.load(handle)
          except (OSError, ValueError) as error:
              fail_scanner(f"could not read {EXCEPTIONS_PATH} ({error})")

          accepted = {e["package"]: e for e in accepted_doc.get("exceptions", [])}

          # Which packages actually ship. If the production report is unusable,
          # every advisory is treated as production scope.
          try:
              with open("audit-prod.json", "r", encoding="utf-8") as handle:
                  prod_packages = set(json.load(handle).get("vulnerabilities", {}))
              prod_known = True
          except (OSError, ValueError):
              prod_packages = None
              prod_known = False
              print("::warning::Production-only audit unavailable; treating all "
                    "advisories as production scope.")

          blocking = {
              name: entry for name, entry in report.get("vulnerabilities", {}).items()
              if entry.get("severity") in ("critical", "high")
          }

          today = datetime.date.today()
          unaccepted, expired, stale = [], [], []

          for name, entry in sorted(blocking.items()):
              scope = "prod" if (not prod_known or name in prod_packages) else "dev"
              exception = accepted.get(name)
              if exception is None:
                  unaccepted.append((name, entry["severity"], scope))
                  continue
              try:
                  expiry = datetime.date.fromisoformat(exception["expires"])
              except (KeyError, ValueError):
                  fail_scanner(f"exception for '{name}' has a missing or invalid 'expires'")
              if expiry < today:
                  expired.append((name, exception["expires"]))

          for name in sorted(accepted):
              if name not in blocking:
                  stale.append(name)

          for name, severity, scope in unaccepted:
              print(f"::error::Unaccepted {severity} advisory in '{name}' ({scope} scope). "
                    f"Fix it, or add a dated exception with a reason to {EXCEPTIONS_PATH}.")
          for name, when in expired:
              print(f"::error::Accepted exception for '{name}' expired on {when}. "
                    f"Re-verify the advisory is still unfixable and renew, or remove it.")
          for name in stale:
              print(f"::error::Exception for '{name}' no longer matches any advisory. "
                    f"Remove it from {EXCEPTIONS_PATH} so the list cannot outlive its reasons.")

          policy_pass = not (unaccepted or expired or stale)

          for level in order:
              if counts[level]:
                  print(f"::notice::npm audit found {counts[level]} {level} vulnerabilities.")

          prod_blocking = sum(
              1 for name in blocking
              if not prod_known or name in prod_packages)

          write_summary([
              "## npm Audit",
              "",
              "- Scanner status: **succeeded**",
              f"- npm audit exit code: {exit_code}",
              f"- Critical: {critical} | High: {high}",
              f"- High/critical reaching production: **{prod_blocking}** of {len(blocking)}",
              f"- Accepted exceptions: {len(accepted)}",
              f"- Unaccepted: {len(unaccepted)} | Expired: {len(expired)} | Stale: {len(stale)}",
              f"- Policy: {'PASS' if policy_pass else 'FAIL'}",
              "",
              "| Severity | Count |",
              "| --- | --- |",
              *[f"| {level} | {counts[level]} |" for level in order],
          ])

          if not policy_pass:
              print("::error::npm audit policy failed: "
                    f"{len(unaccepted)} unaccepted, {len(expired)} expired, "
                    f"{len(stale)} stale.")
              sys.exit(1)
          print(f"npm audit passed: {len(blocking)} high/critical advisories, all "
                f"covered by unexpired accepted exceptions.")
          PYTHON

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Block pull requests that introduce high or critical vulnerabilities.
          fail-on-severity: high
          # No pull-requests: write permission is granted, so do not comment.
          comment-summary-in-pr: never
