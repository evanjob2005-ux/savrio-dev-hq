name: Release

# Controlled release of the Savrio Dev HQ engineering operating system (the
# repository itself, not the Savrio application). Releases are always manual.
#
# Gate model (see RELEASE_PROCESS.md / VERSIONING_POLICY.md):
#   validate  -> version, branch, readiness evidence, forward progression
#   verify    -> required CI checks succeeded for the EXACT target commit
#   publish   -> under a protected environment: re-verify the tag set and the
#                required checks AFTER the approval wait, then annotated tag +
#                GitHub release with the tag rolled back if the release fails
#
# The verification in `verify-checks` is fail-fast only. An approval can sit
# for hours, and a required check can be re-run and go pending or fail while it
# does, so the publish job collects and evaluates check state again on the far
# side of the gate. That evaluation, not the earlier one, is what the release
# is published on.
#
# REQUIRED GitHub-side configuration that cannot be expressed in this file
# (see docs: Actions > deployments-and-environments):
#   * Create an environment named "production-release".
#   * Add required reviewers to that environment (human release approval).
#   * Enable "Prevent self-review" so the dispatcher cannot approve themselves.
#   * Protect main with branch protection + required status checks so the
#     commits this workflow releases have actually passed CI.
# Without those settings the publish job still runs its in-workflow gates, but
# human approval and self-review prevention are enforced only by the
# environment protection rules configured in repository settings.
#
# The set of checks a release is gated on is declared in this file, as
# `verify-checks.env.REQUIRED_CHECKS`. It is this workflow's own list, not a
# reading of the branch ruleset -- GitHub's required-status-check configuration
# is a repository setting and this file cannot see it. Keeping the two
# reconciled is a Founder-owned settings obligation; see OBL-29 in
# docs/plans/OPEN_OBLIGATIONS.md.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Semantic version without a leading v (e.g. 1.2.0 or 1.0.0-rc.1)"
        required: true
        type: string
      changelog:
        description: "Release notes / changelog (Added, Changed, Fixed, Security, ...)"
        required: true
        type: string
      rollback_plan:
        description: "Rollback plan if this release must be reverted"
        required: true
        type: string
      title:
        description: "Release title (defaults to 'Savrio Dev HQ v<version>')"
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: false
      target:
        description: "Commit SHA or ref to release from (defaults to the main branch tip)"
        required: false
        type: string
        default: ""
      draft:
        description: "Create the release as a draft"
        required: false
        type: boolean
        default: false
      allow_no_new_commits:
        description: "Documented exception: allow releasing a commit already carrying the latest release"
        required: false
        type: boolean
        default: false

# Read-only by default. Only the publish job is granted contents: write.
permissions:
  contents: read

# One release at a time, repository-wide, and never cancel one in flight.
#
# The group was previously scoped by version, which serialized only reruns of
# the SAME version and let different versions run concurrently. v2 and v3 could
# then both validate forward progression against the same previous tag --
# neither is visible to the other while both are in flight -- and publish in
# either order, so the older version could land last and become the latest
# release. A constant group serializes the entire workflow run, including the
# protected-environment approval wait, so the tag set validate reasons about
# cannot be moved by another release. Tags pushed by hand are outside that
# guarantee, which is why publish re-checks the tag set (see
# "Re-check that the remote release-tag set has not moved").
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      target_sha: ${{ steps.resolve.outputs.target_sha }}
      title: ${{ steps.resolve.outputs.title }}
      latest_tag: ${{ steps.resolve.outputs.latest_tag }}
      resume: ${{ steps.resolve.outputs.resume }}
      tag_digest: ${{ steps.tagset.outputs.tag_digest }}
    steps:
      - name: Restrict releases to the main branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "main" ]]; then
            echo "::error::Releases may only be initiated from the 'main' branch (was '${REF_NAME}')."
            exit 1
          fi
          echo "Release initiated from main."

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate version, evidence, and target
        id: resolve
        env:
          VERSION: ${{ inputs.version }}
          PRERELEASE_INPUT: ${{ inputs.prerelease }}
          TARGET: ${{ inputs.target }}
          TITLE_INPUT: ${{ inputs.title }}
          CHANGELOG: ${{ inputs.changelog }}
          ROLLBACK: ${{ inputs.rollback_plan }}
          ALLOW_NO_NEW_COMMITS: ${{ inputs.allow_no_new_commits }}
          HEAD_SHA: ${{ github.sha }}
          # Needed only to ask whether a release is attached to a tag that
          # already exists; see the resume path below.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python <<'PYTHON'
          import os
          import re
          import subprocess
          import sys

          def die(message):
              print(f"::error::{message}")
              sys.exit(1)

          def git(*args):
              return subprocess.run(
                  ["git", *args], capture_output=True, text=True)

          version = os.environ["VERSION"].strip()
          title_input = os.environ.get("TITLE_INPUT", "")
          changelog = os.environ.get("CHANGELOG", "")
          rollback = os.environ.get("ROLLBACK", "")
          target = os.environ.get("TARGET", "").strip()
          head_sha = os.environ["HEAD_SHA"].strip()
          prerelease_input = os.environ.get("PRERELEASE_INPUT", "false").strip().lower()
          allow_no_new = os.environ.get("ALLOW_NO_NEW_COMMITS", "false").strip().lower() == "true"

          # Full Semantic Versioning 2.0.0 grammar (semver.org). Rejects empty
          # identifiers, leading zeroes in numeric identifiers, and invalid
          # characters (e.g. 1.0.0-01, 1.0.0-alpha..1, 1.0.0-.alpha, 1.0.0+b..1).
          SEMVER = re.compile(
              r"^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)"
              r"(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)"
              r"(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?"
              r"(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$")

          match = SEMVER.match(version)
          if not match:
              die(f"Version '{version}' is not valid Semantic Versioning 2.0.0. "
                  "Check for empty or leading-zero identifiers and invalid characters.")

          # Release-readiness evidence must be present.
          if not changelog.strip():
              die("A changelog / release notes value is required.")
          if not rollback.strip():
              die("A rollback plan is required.")

          # Reject control characters in the title to prevent workflow-command
          # or output-file injection (no CR/LF can create extra output records).
          if title_input and any(ord(ch) < 0x20 for ch in title_input):
              die("Release title must not contain control characters (including CR/LF).")

          tag = f"v{version}"
          prerelease = "true" if (prerelease_input == "true" or "-" in version) else "false"
          title = title_input.strip() or f"Savrio Dev HQ {tag}"

          # Resolve the commit to release; default to the main tip.
          if not target:
              target_sha = head_sha
          else:
              result = git("rev-parse", "--verify", "--quiet", f"{target}^{{commit}}")
              if result.returncode != 0 or not result.stdout.strip():
                  die(f"Target ref '{target}' could not be resolved to a commit.")
              target_sha = result.stdout.strip()

          # Refuse to release code that is not part of main's history.
          if git("merge-base", "--is-ancestor", target_sha, head_sha).returncode != 0:
              die(f"Target commit '{target_sha}' is not an ancestor of main.")

          # Duplicate tag protection (local history and remote).
          #
          # An existing tag normally means the release was already made and the
          # run must stop. There is exactly one exception, and it is the
          # wreckage a run leaves behind when it pushes the tag and then fails
          # before the release exists: the tag is ANNOTATED, peels to THIS
          # exact target commit, and has NO release attached. Failing that
          # state closed leaves the version permanently unreleasable with no
          # path forward but a human deleting the remote tag by hand, because
          # every rerun dies here. Publish now rolls the tag back on failure,
          # so this path is the backstop for a rollback that itself failed.
          tag_local = git("rev-parse", "-q", "--verify", f"refs/tags/{tag}").returncode == 0
          tag_remote = git(
              "ls-remote", "--exit-code", "--tags", "origin", f"refs/tags/{tag}"
          ).returncode == 0
          resume = False
          if tag_local or tag_remote:
              if not tag_local:
                  git("fetch", "--force", "origin", f"refs/tags/{tag}:refs/tags/{tag}")
              obj = git("cat-file", "-t", f"refs/tags/{tag}").stdout.strip()
              peeled = git("rev-list", "-n", "1", f"refs/tags/{tag}").stdout.strip()
              release_present = subprocess.run(
                  ["gh", "release", "view", tag],
                  capture_output=True, text=True).returncode == 0
              if obj == "tag" and peeled == target_sha and not release_present:
                  resume = True
                  print(f"::warning::Tag {tag} already exists, is annotated, and "
                        f"points at {target_sha} with no release attached. "
                        "Treating this run as a resume of a release that failed "
                        "after the tag was pushed.")
              else:
                  die(f"Tag '{tag}' already exists and is not a resumable "
                      f"partial release (object type='{obj or 'unknown'}', "
                      f"commit='{peeled or 'unknown'}', expected an annotated "
                      f"tag at '{target_sha}'; release attached="
                      f"{'yes' if release_present else 'no'}).")

          def parse(v):
              m = SEMVER.match(v)
              if not m:
                  return None
              major, minor, patch, pre, _build = m.groups()
              return (int(major), int(minor), int(patch), pre)

          def precedence_key(parsed):
              major, minor, patch, pre = parsed
              if pre is None:
                  pre_key = (1,)  # a normal release outranks any pre-release
              else:
                  ids = []
                  for ident in pre.split("."):
                      if ident.isdigit():
                          ids.append((0, int(ident), ""))
                      else:
                          ids.append((1, 0, ident))
                  pre_key = (0, tuple(ids))
              return (major, minor, patch, pre_key)

          # Forward progression relative to the latest existing release tag.
          # On a resume the tag being released is already in this list; leaving
          # it in would make the version fail to move forward from itself.
          tags = [t for t in git("tag", "--list", "v*").stdout.split() if t]
          if resume:
              tags = [t for t in tags if t != tag]
          latest_tag = ""
          latest_parsed = None
          for existing in tags:
              parsed = parse(existing[1:])  # strip leading 'v'
              if parsed is None:
                  continue
              if latest_parsed is None or precedence_key(parsed) > precedence_key(latest_parsed):
                  latest_parsed = parsed
                  latest_tag = existing

          if latest_parsed is not None:
              if precedence_key(parse(version)) <= precedence_key(latest_parsed):
                  die(f"Version {tag} does not move forward from the latest release {latest_tag}.")

              # Prevent a release with no new commits unless explicitly allowed.
              latest_commit = git("rev-list", "-n", "1", latest_tag).stdout.strip()
              if latest_commit and latest_commit == target_sha and not allow_no_new:
                  die(f"Target commit already carries {latest_tag}; no new commits to release. "
                      "Set allow_no_new_commits to override intentionally.")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              # Every value below is derived from validated, control-character-free
              # data, so single-line key=value output records are safe.
              out.write(f"version={version}\n")
              out.write(f"tag={tag}\n")
              out.write(f"prerelease={prerelease}\n")
              out.write(f"target_sha={target_sha}\n")
              out.write(f"title={title}\n")
              out.write(f"latest_tag={latest_tag}\n")
              out.write(f"resume={'true' if resume else 'false'}\n")

          print(f"Validated {tag} at {target_sha} (prerelease={prerelease}, "
                f"previous={latest_tag or 'none'}, resume={resume}).")
          PYTHON

      - name: Snapshot the remote release-tag set
        id: tagset
        run: |
          set -euo pipefail
          # Forward progression above was decided against this exact set of
          # release tags. Publish re-computes the digest after the approval
          # wait and refuses to publish if it moved, so a release cannot be
          # cut against a tag set that no longer exists.
          digest="$(git ls-remote --tags origin 'refs/tags/v*' \
                    | sort | sha256sum | cut -d' ' -f1)"
          echo "tag_digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "Remote release-tag set digest: ${digest}"

      - name: Release validation summary
        if: always()
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
          TARGET_SHA: ${{ steps.resolve.outputs.target_sha }}
          PRERELEASE: ${{ steps.resolve.outputs.prerelease }}
          LATEST_TAG: ${{ steps.resolve.outputs.latest_tag }}
          RESUME: ${{ steps.resolve.outputs.resume }}
          OUTCOME: ${{ steps.resolve.outcome }}
        run: |
          set -euo pipefail
          {
            echo "## Release Validation"
            echo ""
            echo "- Result: ${OUTCOME}"
            echo "- Tag: ${TAG:-unresolved}"
            echo "- Target commit: ${TARGET_SHA:-unresolved}"
            echo "- Previous release: ${LATEST_TAG:-none}"
            echo "- Pre-release: ${PRERELEASE:-unknown}"
            echo "- Resuming a partially completed release: ${RESUME:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

  verify-checks:
    name: Verify Required Checks
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      statuses: read
    defaults:
      run:
        shell: bash
    env:
      CHECK_PHASE: pre-approval
      # The GitHub App that must have published a check run for that run to
      # count toward a required check. A check-run NAME is not an identity:
      # any installed app, and any workflow holding a token with checks:write,
      # can report a check run called "Secret Scan" on a commit. Without this
      # allowlist the gate accepted whoever spoke last under the right name.
      # All 16 names below are jobs in this repository's own workflows, so the
      # publisher is always GitHub Actions.
      REQUIRED_CHECK_APP: github-actions
      # The checks a release is gated on, by check-run name. A check-run name is
      # the job's `name:` field, so these must be kept in step with the `name:`
      # values in the workflows listed beside them. An unrecognised or renamed
      # job shows up here as MISSING and fails the release closed.
      #
      # Naming the set is what makes this job's title true. Previously it
      # accepted "every check run on the commit", which verified no *required*
      # check at all -- one passing check of any kind satisfied it -- and could
      # never pass, because the release workflow's own check runs are on the
      # same commit and are still in progress while this job evaluates them.
      #
      # Deliberately NOT required, so the exclusions are reviewable:
      #   * "Markdown (advisory)"  (lint.yml) -- the job reports findings and
      #     always exits 0; it cannot fail, so requiring it asserts nothing.
      #   * "Dependency Review"    (dependencies.yml) -- carries
      #     `if: github.event_name == 'pull_request'`, so it never runs on the
      #     push that produces a releasable commit on main.
      #   * This workflow's own jobs -- a job cannot be its own precondition.
      REQUIRED_CHECKS: |
        Repository Integrity
        Structured Data Validation
        Application Validation (Conditional)
        YAML
        GitHub Actions
        JSON
        Formatting and Naming
        Scripts (conditional)
        Unit and Static Validation
        End-to-End Smoke
        Secret Scan
        Credential and Artifact Audit
        GitHub Actions Hardening
        Static Analysis (Semgrep)
        Manifest and Lockfile Health
        npm Audit
    steps:
      - name: Collect check runs for the target commit
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.target_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Check runs (GitHub Actions and other check-run providers), one
          # compact JSON record per line. `@json` guarantees a single line per
          # record; --paginate walks every page.
          # app.slug carries the publisher identity the verifier checks; a
          # record with a required name but a null or unexpected app is the
          # impostor case, so the field is projected rather than dropped.
          gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate \
            --jq '.check_runs[]
                  | {id, name, status, conclusion, started_at, completed_at,
                     app_slug: (.app.slug // null), app_id: (.app.id // null)}
                  | @json' > "${RUNNER_TEMP}/check-runs.jsonl"

          # Legacy combined commit status (e.g. external status contexts).
          gh api "repos/${REPO}/commits/${SHA}/status" --jq '.state' \
            > "${RUNNER_TEMP}/combined-status.txt"

          echo "Collected $(wc -l < "${RUNNER_TEMP}/check-runs.jsonl") check run record(s)."

      - name: Verify every required check succeeded
        env:
          SHA: ${{ needs.validate.outputs.target_sha }}
          CHECK_RUNS_FILE: ${{ runner.temp }}/check-runs.jsonl
          COMBINED_STATUS_FILE: ${{ runner.temp }}/combined-status.txt
        run: |
          set -euo pipefail
          # BEGIN required-check verifier -- byte-identical copy also runs in
          # the `publish` job after the environment approval (see P0-11). The
          # two copies exist because a composite action would need a new file
          # and the two jobs run on different runners; keep them in step.
          python <<'PYTHON'
          import json
          import os
          import sys

          # Exit status, per STD-CTRL-001 rule 5 (absence of evidence fails
          # closed and says so):
          #   0  every required check succeeded for the target commit
          #   1  a required check is missing, unfinished, failed, or foreign
          #   2  could not evaluate: required input absent or unparseable
          def error(message):
              print(f"::error::{message}")

          def unevaluable(message):
              error(f"Cannot evaluate required checks: {message}")
              sys.exit(2)

          sha = os.environ["SHA"]

          allowed_app = os.environ.get("REQUIRED_CHECK_APP", "").strip()
          if not allowed_app:
              unevaluable("REQUIRED_CHECK_APP is empty; without a publisher "
                          "allowlist any app can report a check run under a "
                          "required name.")

          required = [line.strip() for line in
                      os.environ.get("REQUIRED_CHECKS", "").splitlines()
                      if line.strip()]
          if not required:
              unevaluable("REQUIRED_CHECKS is empty; refusing to publish "
                          "without a required-check set.")
          required_set = set(required)

          try:
              with open(os.environ["COMBINED_STATUS_FILE"], encoding="utf-8") as handle:
                  combined = handle.read().strip()
          except OSError as exc:
              unevaluable(f"combined commit status unreadable ({exc})")
          if not combined:
              unevaluable(f"combined commit status for {sha} is empty")

          runs = []
          try:
              with open(os.environ["CHECK_RUNS_FILE"], encoding="utf-8") as handle:
                  for number, line in enumerate(handle, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          runs.append(json.loads(line))
                      except ValueError as exc:
                          unevaluable(f"check-run record on line {number} is "
                                      f"not JSON ({exc})")
          except OSError as exc:
              unevaluable(f"check-run records unreadable ({exc})")

          # Recency is decided on when a run STARTED, never on when it
          # finished. Ordering on completed_at first ranked an in-progress
          # rerun -- whose completed_at is null, sorting below every real
          # timestamp -- BENEATH the stale success it was started to replace,
          # so the gate accepted an obsolete green while the current run was
          # still pending. started_at is populated for queued, in-progress and
          # completed runs alike; the check-run id breaks ties and is
          # monotonic within a repository.
          def recency(run):
              return (str(run.get("started_at") or ""), int(run.get("id") or 0))

          def orderable(run):
              return bool(run.get("started_at")) or bool(run.get("id"))

          # A check run counts toward a required name only when the app that
          # published it is the expected one. The filter is applied BEFORE
          # picking the latest run: selecting first would let a foreign app
          # hand the gate a green run under a required name.
          by_name = {}
          foreign = {}
          for run in runs:
              name = str(run.get("name") or "")
              app = str(run.get("app_slug") or "")
              if app == allowed_app:
                  by_name.setdefault(name, []).append(run)
              elif name in required_set:
                  foreign.setdefault(name, set()).add(app or "(no app)")

          failed = []
          rows = []
          for name in required:
              # A commit accumulates one check run per name for every workflow
              # run that touched it, so a failure that was later re-run green
              # is still in this list. The verdict is taken from the latest
              # run, because requiring every occurrence to be green would let
              # one historical failure block that commit from ever being
              # released -- but an UNFINISHED run is treated separately below.
              candidates = by_name.get(name) or []
              if not candidates:
                  failed.append(name)
                  error(f"Required check '{name}' has no check run from "
                        f"'{allowed_app}' on {sha}.")
                  rows.append(f"| `{name}` | (absent) | - | **MISSING** |")
                  continue
              if not all(orderable(run) for run in candidates):
                  unevaluable(f"a check run named '{name}' on {sha} carries "
                              "neither started_at nor id, so its runs cannot "
                              "be ordered")

              latest = max(candidates, key=recency)
              unfinished = [run for run in candidates
                            if str(run.get("status") or "") != "completed"]
              status = str(latest.get("status") or "unknown")
              conclusion = str(latest.get("conclusion") or "pending")

              if unfinished:
                  # Any live run of a required name means the check state for
                  # this commit is not settled, whichever run sorts latest. An
                  # earlier completed run is not evidence for the current one.
                  failed.append(name)
                  states = ", ".join(sorted({str(run.get("status") or "unknown")
                                             for run in unfinished}))
                  error(f"Required check '{name}' has {len(unfinished)} run(s) "
                        f"still in flight ({states}) on {sha}; an earlier "
                        "completed run of the same check is not evidence for "
                        "the one now running.")
                  verdict = "**UNFINISHED**"
              elif conclusion not in ("success", "neutral"):
                  # `skipped` counts as a failure here on purpose: a required
                  # check that did not run is not evidence that it would have
                  # passed. The original version accepted it.
                  failed.append(name)
                  error(f"Required check '{name}' did not succeed "
                        f"(conclusion={conclusion}).")
                  verdict = "**FAIL**"
              else:
                  verdict = "PASS"
              rows.append(f"| `{name}` | {status} / {conclusion} | "
                          f"`{allowed_app}` | {verdict} |")

          for name in sorted(foreign):
              failed.append(f"{name} (foreign publisher)")
              error(f"Required check name '{name}' was also reported on {sha} "
                    f"by {', '.join(sorted(foreign[name]))}, which is not the "
                    f"required publisher '{allowed_app}'. A check run under a "
                    "required name from an unexpected app blocks the release.")

          if combined in ("failure", "error"):
              failed.append("(combined commit status)")
              error(f"Combined commit status for {sha} is '{combined}'.")

          other = sorted(name for name in by_name if name not in required_set)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              phase = os.environ.get("CHECK_PHASE", "unspecified")
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(f"## Required Checks ({phase})\n\n")
                  out.write(f"- Target commit: `{sha}`\n")
                  out.write(f"- Required publisher: `{allowed_app}`\n")
                  out.write(f"- Required checks: {len(required)}\n")
                  out.write(f"- Check runs on the commit: {len(runs)} "
                            f"({len(by_name)} distinct names from "
                            f"`{allowed_app}`)\n")
                  out.write(f"- Combined commit status: {combined}\n")
                  out.write(f"- Result: {'FAIL' if failed else 'PASS'}\n\n")
                  out.write("| Required check | Latest run | Publisher | "
                            "Verdict |\n|---|---|---|---|\n")
                  for row in rows:
                      out.write(row + "\n")
                  if other:
                      out.write("\nPresent but not required, reported for "
                                "information only: "
                                + ", ".join(f"`{n}`" for n in other) + "\n")

          if failed:
              error(f"Required checks did not pass for target commit {sha}: "
                    f"{', '.join(failed)}.")
              sys.exit(1)

          print(f"All {len(required)} required check(s) succeeded for {sha}, "
                f"published by '{allowed_app}'.")
          PYTHON
          # END required-check verifier

  publish:
    name: Publish Release
    needs:
      - validate
      - verify-checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Protected environment: human approval and self-review prevention are
    # enforced by the environment's protection rules (configured in settings).
    environment: production-release
    # The only job granted write access, narrowly to create the tag and
    # release. checks/statuses are read so the required-check state can be
    # re-collected AFTER the approval wait rather than trusted from before it.
    permissions:
      contents: write
      checks: read
      statuses: read
    defaults:
      run:
        shell: bash
    env:
      CHECK_PHASE: post-approval
      # Must match the values in `verify-checks`. The check state is collected
      # again here because `verify-checks` runs BEFORE the protected
      # environment gate: an approval can sit for hours, and during that time a
      # required check can be re-run and go pending, or be re-run and fail. The
      # earlier evaluation is a fail-fast convenience; THIS one is the evidence
      # the release is actually published on.
      REQUIRED_CHECK_APP: github-actions
      REQUIRED_CHECKS: |
        Repository Integrity
        Structured Data Validation
        Application Validation (Conditional)
        YAML
        GitHub Actions
        JSON
        Formatting and Naming
        Scripts (conditional)
        Unit and Static Validation
        End-to-End Smoke
        Secret Scan
        Credential and Artifact Audit
        GitHub Actions Hardening
        Static Analysis (Semgrep)
        Manifest and Lockfile Health
        npm Audit
    steps:
      - name: Check out target commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.validate.outputs.target_sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Re-check that the remote release-tag set has not moved
        env:
          EXPECTED: ${{ needs.validate.outputs.tag_digest }}
        run: |
          set -euo pipefail
          # Forward progression was decided in `validate` against the tag set
          # as it stood then. If a tag appeared since -- another release, or a
          # hand-pushed tag -- that decision was made against a tag set that no
          # longer exists, and this release could land out of order.
          if [[ -z "$EXPECTED" ]]; then
            echo "::error::No release-tag digest was recorded at validation time; cannot tell whether the tag set moved during the approval wait."
            exit 2
          fi
          actual="$(git ls-remote --tags origin 'refs/tags/v*' \
                    | sort | sha256sum | cut -d' ' -f1)"
          if [[ "$actual" != "$EXPECTED" ]]; then
            echo "::error::The remote release-tag set changed between validation and publish (recorded ${EXPECTED}, found ${actual}). Forward progression was validated against a tag set that no longer exists. Re-run the release so validation is redone against current tags."
            exit 1
          fi
          echo "Remote release-tag set unchanged since validation (${actual})."

      - name: Re-collect check runs for the target commit
        env:
          REPO: ${{ github.repository }}
          SHA: ${{ needs.validate.outputs.target_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          gh api "repos/${REPO}/commits/${SHA}/check-runs" --paginate \
            --jq '.check_runs[]
                  | {id, name, status, conclusion, started_at, completed_at,
                     app_slug: (.app.slug // null), app_id: (.app.id // null)}
                  | @json' > "${RUNNER_TEMP}/check-runs.jsonl"

          gh api "repos/${REPO}/commits/${SHA}/status" --jq '.state' \
            > "${RUNNER_TEMP}/combined-status.txt"

          echo "Re-collected $(wc -l < "${RUNNER_TEMP}/check-runs.jsonl") check run record(s) after the approval gate."

      - name: Re-verify every required check succeeded
        env:
          SHA: ${{ needs.validate.outputs.target_sha }}
          CHECK_RUNS_FILE: ${{ runner.temp }}/check-runs.jsonl
          COMBINED_STATUS_FILE: ${{ runner.temp }}/combined-status.txt
        run: |
          set -euo pipefail
          # BEGIN required-check verifier -- byte-identical copy also runs in
          # the `verify-checks` job before the environment approval. The two
          # copies exist because a composite action would need a new file and
          # the two jobs run on different runners; keep them in step.
          python <<'PYTHON'
          import json
          import os
          import sys

          # Exit status, per STD-CTRL-001 rule 5 (absence of evidence fails
          # closed and says so):
          #   0  every required check succeeded for the target commit
          #   1  a required check is missing, unfinished, failed, or foreign
          #   2  could not evaluate: required input absent or unparseable
          def error(message):
              print(f"::error::{message}")

          def unevaluable(message):
              error(f"Cannot evaluate required checks: {message}")
              sys.exit(2)

          sha = os.environ["SHA"]

          allowed_app = os.environ.get("REQUIRED_CHECK_APP", "").strip()
          if not allowed_app:
              unevaluable("REQUIRED_CHECK_APP is empty; without a publisher "
                          "allowlist any app can report a check run under a "
                          "required name.")

          required = [line.strip() for line in
                      os.environ.get("REQUIRED_CHECKS", "").splitlines()
                      if line.strip()]
          if not required:
              unevaluable("REQUIRED_CHECKS is empty; refusing to publish "
                          "without a required-check set.")
          required_set = set(required)

          try:
              with open(os.environ["COMBINED_STATUS_FILE"], encoding="utf-8") as handle:
                  combined = handle.read().strip()
          except OSError as exc:
              unevaluable(f"combined commit status unreadable ({exc})")
          if not combined:
              unevaluable(f"combined commit status for {sha} is empty")

          runs = []
          try:
              with open(os.environ["CHECK_RUNS_FILE"], encoding="utf-8") as handle:
                  for number, line in enumerate(handle, 1):
                      line = line.strip()
                      if not line:
                          continue
                      try:
                          runs.append(json.loads(line))
                      except ValueError as exc:
                          unevaluable(f"check-run record on line {number} is "
                                      f"not JSON ({exc})")
          except OSError as exc:
              unevaluable(f"check-run records unreadable ({exc})")

          # Recency is decided on when a run STARTED, never on when it
          # finished. Ordering on completed_at first ranked an in-progress
          # rerun -- whose completed_at is null, sorting below every real
          # timestamp -- BENEATH the stale success it was started to replace,
          # so the gate accepted an obsolete green while the current run was
          # still pending. started_at is populated for queued, in-progress and
          # completed runs alike; the check-run id breaks ties and is
          # monotonic within a repository.
          def recency(run):
              return (str(run.get("started_at") or ""), int(run.get("id") or 0))

          def orderable(run):
              return bool(run.get("started_at")) or bool(run.get("id"))

          # A check run counts toward a required name only when the app that
          # published it is the expected one. The filter is applied BEFORE
          # picking the latest run: selecting first would let a foreign app
          # hand the gate a green run under a required name.
          by_name = {}
          foreign = {}
          for run in runs:
              name = str(run.get("name") or "")
              app = str(run.get("app_slug") or "")
              if app == allowed_app:
                  by_name.setdefault(name, []).append(run)
              elif name in required_set:
                  foreign.setdefault(name, set()).add(app or "(no app)")

          failed = []
          rows = []
          for name in required:
              # A commit accumulates one check run per name for every workflow
              # run that touched it, so a failure that was later re-run green
              # is still in this list. The verdict is taken from the latest
              # run, because requiring every occurrence to be green would let
              # one historical failure block that commit from ever being
              # released -- but an UNFINISHED run is treated separately below.
              candidates = by_name.get(name) or []
              if not candidates:
                  failed.append(name)
                  error(f"Required check '{name}' has no check run from "
                        f"'{allowed_app}' on {sha}.")
                  rows.append(f"| `{name}` | (absent) | - | **MISSING** |")
                  continue
              if not all(orderable(run) for run in candidates):
                  unevaluable(f"a check run named '{name}' on {sha} carries "
                              "neither started_at nor id, so its runs cannot "
                              "be ordered")

              latest = max(candidates, key=recency)
              unfinished = [run for run in candidates
                            if str(run.get("status") or "") != "completed"]
              status = str(latest.get("status") or "unknown")
              conclusion = str(latest.get("conclusion") or "pending")

              if unfinished:
                  # Any live run of a required name means the check state for
                  # this commit is not settled, whichever run sorts latest. An
                  # earlier completed run is not evidence for the current one.
                  failed.append(name)
                  states = ", ".join(sorted({str(run.get("status") or "unknown")
                                             for run in unfinished}))
                  error(f"Required check '{name}' has {len(unfinished)} run(s) "
                        f"still in flight ({states}) on {sha}; an earlier "
                        "completed run of the same check is not evidence for "
                        "the one now running.")
                  verdict = "**UNFINISHED**"
              elif conclusion not in ("success", "neutral"):
                  # `skipped` counts as a failure here on purpose: a required
                  # check that did not run is not evidence that it would have
                  # passed. The original version accepted it.
                  failed.append(name)
                  error(f"Required check '{name}' did not succeed "
                        f"(conclusion={conclusion}).")
                  verdict = "**FAIL**"
              else:
                  verdict = "PASS"
              rows.append(f"| `{name}` | {status} / {conclusion} | "
                          f"`{allowed_app}` | {verdict} |")

          for name in sorted(foreign):
              failed.append(f"{name} (foreign publisher)")
              error(f"Required check name '{name}' was also reported on {sha} "
                    f"by {', '.join(sorted(foreign[name]))}, which is not the "
                    f"required publisher '{allowed_app}'. A check run under a "
                    "required name from an unexpected app blocks the release.")

          if combined in ("failure", "error"):
              failed.append("(combined commit status)")
              error(f"Combined commit status for {sha} is '{combined}'.")

          other = sorted(name for name in by_name if name not in required_set)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              phase = os.environ.get("CHECK_PHASE", "unspecified")
              with open(summary_path, "a", encoding="utf-8") as out:
                  out.write(f"## Required Checks ({phase})\n\n")
                  out.write(f"- Target commit: `{sha}`\n")
                  out.write(f"- Required publisher: `{allowed_app}`\n")
                  out.write(f"- Required checks: {len(required)}\n")
                  out.write(f"- Check runs on the commit: {len(runs)} "
                            f"({len(by_name)} distinct names from "
                            f"`{allowed_app}`)\n")
                  out.write(f"- Combined commit status: {combined}\n")
                  out.write(f"- Result: {'FAIL' if failed else 'PASS'}\n\n")
                  out.write("| Required check | Latest run | Publisher | "
                            "Verdict |\n|---|---|---|---|\n")
                  for row in rows:
                      out.write(row + "\n")
                  if other:
                      out.write("\nPresent but not required, reported for "
                                "information only: "
                                + ", ".join(f"`{n}`" for n in other) + "\n")

          if failed:
              error(f"Required checks did not pass for target commit {sha}: "
                    f"{', '.join(failed)}.")
              sys.exit(1)

          print(f"All {len(required)} required check(s) succeeded for {sha}, "
                f"published by '{allowed_app}'.")
          PYTHON
          # END required-check verifier

      - name: Re-verify tag and release state
        id: tagstate
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release '${TAG}' now exists; aborting to avoid a duplicate."
            exit 1
          fi

          resume=false
          remote_tag=0
          remote_tag="$(git ls-remote --tags origin "refs/tags/${TAG}" | wc -l)"
          local_tag=false
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            local_tag=true
          fi

          if [[ "$remote_tag" -gt 0 || "$local_tag" == "true" ]]; then
            # A tag with no release attached is exactly the wreckage of a run
            # that pushed the tag and then failed before the release existed.
            # Resume it, but only when it is provably the tag this run would
            # have created: annotated, and peeling to the validated target.
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}" || true
            obj="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo none)"
            peeled="$(git rev-list -n 1 "refs/tags/${TAG}" 2>/dev/null || echo none)"
            if [[ "$obj" == "tag" && "$peeled" == "$TARGET_SHA" ]]; then
              resume=true
              echo "::warning::Tag ${TAG} already exists, is annotated, and points at ${TARGET_SHA} with no release attached. Resuming a partially completed release rather than wedging on it."
            else
              echo "::error::Tag '${TAG}' already exists and is not a resumable partial release (object type='${obj}', commit='${peeled}', expected an annotated tag at '${TARGET_SHA}')."
              exit 1
            fi
          fi

          echo "resume=${resume}" >> "$GITHUB_OUTPUT"
          echo "Tag state for ${TAG}: resume=${resume}."

      - name: Create annotated tag and GitHub release
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TITLE: ${{ needs.validate.outputs.title }}
          VERSION: ${{ needs.validate.outputs.version }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          RESUME: ${{ steps.tagstate.outputs.resume }}
          CHANGELOG: ${{ inputs.changelog }}
          ROLLBACK: ${{ inputs.rollback_plan }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Assemble release notes from the release-readiness evidence. printf
          # '%s' is used so user-provided text is never interpreted.
          notes="${RUNNER_TEMP}/release-notes.md"
          {
            printf '## Release %s\n\n' "$TAG"
            printf -- '- Version: %s\n' "$VERSION"
            printf -- '- Target commit: %s\n\n' "$TARGET_SHA"
            printf '### Changelog\n\n'
            printf '%s\n\n' "$CHANGELOG"
            printf '### Rollback Plan\n\n'
            printf '%s\n\n' "$ROLLBACK"
            printf '### Validation\n\n'
            printf -- '- Semantic version validated\n'
            printf -- '- Required CI checks verified for the target commit\n'
            printf -- '- Release-readiness evidence provided\n'
          } > "$notes"

          # gh release create would create a lightweight tag; VERSIONING_POLICY
          # calls for real release tags, so create and push an annotated tag
          # explicitly first, then attach the release to it. The tag therefore
          # necessarily reaches the remote BEFORE the release exists, and the
          # window between the two is what has to be made recoverable: without
          # the rollback below, a failed `gh release create` left the remote
          # tag standing, every rerun was rejected by the duplicate-tag guard,
          # and the version could never be released again.
          pushed_here=false
          if [[ "$RESUME" == "true" ]]; then
            echo "Reusing the annotated tag ${TAG} pushed by an earlier run."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" "$TARGET_SHA" -m "$TITLE"
            git push origin "refs/tags/${TAG}"
            pushed_here=true
          fi

          args=(release create "$TAG" --title "$TITLE" --notes-file "$notes")
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          if [[ "$DRAFT" == "true" ]]; then
            args+=(--draft)
          fi

          rc=0
          gh "${args[@]}" || rc=$?
          if [[ "$rc" -eq 0 ]]; then
            echo "Created release ${TAG}."
            exit 0
          fi

          # Release creation failed. Before rolling the tag back, find out
          # whether it actually failed: `gh` can report an error on a response
          # it never read, and deleting the tag under a release that DOES
          # exist would be the more destructive mistake -- it orphans a live
          # release whose tag no longer resolves, which no rerun can repair.
          #
          # `gh release view` exits 1 for BOTH "no such release" and "could not
          # reach the API", so its exit code alone does not license a delete.
          # Only an explicit not-found does. Any other failure is unknown
          # state, and unknown state keeps the tag: an orphaned tag is
          # recoverable by the resume path, an orphaned release is not.
          view_rc=0
          view_out="$(gh release view "$TAG" 2>&1)" || view_rc=$?
          if [[ "$view_rc" -eq 0 ]]; then
            echo "::error::gh release create exited ${rc} but release ${TAG} exists. The tag is deliberately LEFT IN PLACE. Verify the release by hand; do not rerun."
            exit 1
          fi
          if ! grep -qi "release not found" <<<"$view_out"; then
            echo "::error::gh release create exited ${rc}, and whether release ${TAG} exists could not be determined (gh release view exited ${view_rc}: ${view_out}). The tag is deliberately LEFT IN PLACE rather than risk deleting the tag of a release that was created. Check the release by hand: if it exists, the release is complete; if it does not, delete the tag and rerun."
            exit 1
          fi

          if [[ "$pushed_here" == "true" ]]; then
            echo "::warning::Release creation failed (exit ${rc}). Deleting the tag this run pushed so a rerun starts from a clean state."
            if git push --delete origin "refs/tags/${TAG}"; then
              echo "::error::Release creation failed (exit ${rc}); remote tag ${TAG} was rolled back. Rerun the workflow with the same inputs."
            else
              echo "::error::Release creation failed (exit ${rc}) AND the remote tag ${TAG} could not be deleted. A rerun will resume from it: it is annotated, at ${TARGET_SHA}, with no release attached, which validate and the tag-state check both accept as resumable."
            fi
          else
            echo "::error::Release creation failed (exit ${rc}) on a resumed run. Tag ${TAG} is left in place; rerun to resume from it."
          fi
          exit 1

      - name: Release summary
        if: always()
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          TARGET_SHA: ${{ needs.validate.outputs.target_sha }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          RESUME: ${{ steps.tagstate.outputs.resume }}
          OUTCOME: ${{ job.status }}
        run: |
          set -euo pipefail
          {
            echo "## Release Published"
            echo ""
            echo "- Job status: ${OUTCOME}"
            echo "- Tag: ${TAG}"
            echo "- Target commit: ${TARGET_SHA}"
            echo "- Pre-release: ${PRERELEASE}"
            echo "- Draft: ${DRAFT}"
            echo "- Resumed an earlier partial release: ${RESUME:-unknown}"
            echo "- Required checks re-verified after the approval gate: yes"
          } >> "$GITHUB_STEP_SUMMARY"
