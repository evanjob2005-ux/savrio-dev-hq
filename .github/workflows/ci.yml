name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "bugfix/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify required repository files
        shell: bash
        run: |
          required_files=(
            "AGENTS.md"
            "README.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "VERSIONING_POLICY.md"
            "RELEASE_PROCESS.md"
            "ONBOARDING_GUIDE.md"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
            ".github/CODEOWNERS"
          )

          missing_files=0

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Required repository file is missing."
              missing_files=1
            else
              echo "Found: $file"
            fi
          done

          if [ "$missing_files" -ne 0 ]; then
            exit 1
          fi

      - name: Verify required directories
        shell: bash
        run: |
          required_directories=(
            "agents"
            "handbooks"
            "standards"
            "templates"
            "workflows"
          )

          missing_directories=0

          for directory in "${required_directories[@]}"; do
            if [ ! -d "$directory" ]; then
              echo "::error::$directory directory is missing."
              missing_directories=1
            else
              echo "Found: $directory/"
            fi
          done

          if [ "$missing_directories" -ne 0 ]; then
            exit 1
          fi

      - name: Detect unresolved merge conflicts
        shell: bash
        run: |
          if git grep -n \
            -e '^<<<<<<< ' \
            -e '^=======$' \
            -e '^>>>>>>> ' \
            -- . \
            ':(exclude).github/workflows/ci.yml'; then
            echo "::error::Unresolved Git merge conflict markers were found."
            exit 1
          fi

          echo "No unresolved merge conflict markers found."

      - name: Detect trailing whitespace
        shell: bash
        run: |
          if git grep -n -I -E '[[:blank:]]+$' -- \
            '*.md' \
            '*.yml' \
            '*.yaml' \
            '*.json' \
            '*.jsonc' \
            '*.ts' \
            '*.tsx' \
            '*.js' \
            '*.jsx' \
            '*.css' \
            '*.scss' \
            '*.sh' \
            '*.ps1'; then
            echo "::error::Trailing whitespace was found."
            exit 1
          fi

          echo "No trailing whitespace found."

      - name: Verify final newlines
        shell: bash
        run: |
          python3 <<'PYTHON'
          from pathlib import Path

          checked_extensions = {
              ".md",
              ".yml",
              ".yaml",
              ".json",
              ".jsonc",
              ".ts",
              ".tsx",
              ".js",
              ".jsx",
              ".css",
              ".scss",
              ".sh",
              ".ps1",
          }

          ignored_directories = {
              ".git",
              "node_modules",
              ".next",
              "dist",
              "build",
              "coverage",
          }

          failures = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(part in ignored_directories for part in path.parts):
                  continue

              if path.suffix.lower() not in checked_extensions:
                  continue

              content = path.read_bytes()

              if content and not content.endswith(b"\n"):
                  failures.append(str(path))

          if failures:
              for failure in failures:
                  print(f"::error file={failure}::File does not end with a newline.")

              raise SystemExit(1)

          print("All checked files end with a newline.")
          PYTHON

  yaml-validation:
    name: YAML Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install YAML validator
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate YAML files
        shell: bash
        run: |
          python <<'PYTHON'
          from pathlib import Path

          import yaml

          ignored_directories = {
              ".git",
              "node_modules",
              ".next",
              "dist",
              "build",
              "coverage",
          }

          failures = []

          for path in Path(".").rglob("*"):
              if not path.is_file():
                  continue

              if any(part in ignored_directories for part in path.parts):
                  continue

              if path.suffix.lower() not in {".yml", ".yaml"}:
                  continue

              try:
                  with path.open("r", encoding="utf-8") as file:
                      list(yaml.safe_load_all(file))
                  print(f"Valid: {path}")
              except Exception as error:
                  failures.append((path, error))

          if failures:
              for path, error in failures:
                  print(f"::error file={path}::{error}")

              raise SystemExit(1)

          print("All YAML files are valid.")
          PYTHON

  node-validation:
    name: Conditional Node Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect Node.js project
        id: node-project
        shell: bash
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Node.js project detected."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found. Node.js validation will be skipped."
          fi

      - name: Set up Node.js
        if: steps.node-project.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.node-project.outputs.exists == 'true'
        run: npm ci

      - name: Run lint
        if: steps.node-project.outputs.exists == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+lint$'; then
            npm run lint
          else
            echo "No lint script found. Skipping."
          fi

      - name: Run type checking
        if: steps.node-project.outputs.exists == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+typecheck$'; then
            npm run typecheck
          elif npm run | grep -qE '^[[:space:]]+type-check$'; then
            npm run type-check
          else
            echo "No type-checking script found. Skipping."
          fi

      - name: Run tests
        if: steps.node-project.outputs.exists == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+test$'; then
            npm test -- --runInBand
          else
            echo "No test script found. Skipping."
          fi

      - name: Run build
        if: steps.node-project.outputs.exists == 'true'
        shell: bash
        run: |
          if npm run | grep -qE '^[[:space:]]+build$'; then
            npm run build
          else
            echo "No build script found. Skipping."
          fi