name: Continuous Integration

# Primary repository-wide integrity gate for the Savrio Dev HQ engineering
# operating system. This workflow validates the health of the repository as a
# documentation-first product and, only when a Node.js project is actually
# present, exercises the co-located application. Specialized linting, security
# scanning, dependency auditing, and releases live in their own workflows.

on:
  push:
    branches:
      - main
      - feature/dev-hq-operating-system
  pull_request:
    branches:
      - main
      - feature/dev-hq-operating-system
  workflow_dispatch:

# Least privilege: continuous integration only reads the repository.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save runner time. Each pull
# request and each branch push gets its own concurrency group.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-integrity:
    name: Repository Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required repository files
        id: files
        run: |
          set -euo pipefail

          required_files=(
            "README.md"
            "AGENTS.md"
            "CONTRIBUTING.md"
            "SECURITY.md"
            "VERSIONING_POLICY.md"
            "RELEASE_PROCESS.md"
            "ONBOARDING_GUIDE.md"
            ".editorconfig"
            ".gitattributes"
            ".gitignore"
            ".github/CODEOWNERS"
            ".github/pull_request_template.md"
          )

          missing=0
          for file in "${required_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "Found: $file"
            else
              echo "::error file=${file}::Required repository file is missing."
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            echo "### Repository integrity: missing required files" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Verify required directories
        id: dirs
        run: |
          set -euo pipefail

          required_directories=(
            "agents"
            "handbooks"
            "standards"
            "templates"
            "docs"
          )

          missing=0
          for directory in "${required_directories[@]}"; do
            if [[ -d "$directory" ]]; then
              echo "Found: ${directory}/"
            else
              echo "::error::Required directory is missing: ${directory}/"
              missing=1
            fi
          done

          if [[ "$missing" -ne 0 ]]; then
            exit 1
          fi

      - name: Detect unresolved merge conflict markers
        id: conflicts
        run: |
          set -euo pipefail

          # Match only the unambiguous conflict markers (7 angle brackets
          # followed by a space). The counted-repetition regex means this
          # workflow file does not contain the literal markers and therefore
          # cannot match itself, and Markdown setext underlines ("=======")
          # are intentionally not treated as conflicts.
          if git grep -nIE '^(<{7}|>{7}) ' -- .; then
            echo "::error::Unresolved Git merge conflict markers were found."
            exit 1
          fi

          echo "No unresolved merge conflict markers found."

      - name: Detect trailing whitespace
        id: whitespace
        run: |
          set -euo pipefail

          # .editorconfig intentionally disables trailing-whitespace trimming
          # for Markdown (hard line breaks), so Markdown is excluded here.
          if git grep -nIE '[[:blank:]]+$' -- . ':(exclude)*.md'; then
            echo "::error::Trailing whitespace was found in non-Markdown files."
            exit 1
          fi

          echo "No trailing whitespace found."

      - name: Check files end with a newline
        id: newline
        run: |
          set -euo pipefail

          # .editorconfig requests a final newline for all files. This is
          # surfaced as a warning rather than a hard failure so that the gate
          # never blocks on files that predate this policy; pull requests are
          # the right place to enforce the rule on newly touched files.
          missing=0
          while IFS= read -r -d '' file; do
            case "$file" in
              *.png|*.jpg|*.jpeg|*.gif|*.ico|*.webp|*.avif|*.woff|*.woff2|*.ttf|*.otf|*.pdf)
                continue
                ;;
            esac
            if [[ -s "$file" ]] && [[ -n "$(tail -c 1 "$file")" ]]; then
              echo "::warning file=${file}::File does not end with a newline."
              missing=$((missing + 1))
            fi
          done < <(git ls-files -z)

          {
            echo "## Final Newline Check"
            echo ""
            echo "- Files missing a final newline: ${missing} (reported as warnings)"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "Final newline check complete. ${missing} file(s) flagged."

      - name: Validate CODEOWNERS ownership
        id: codeowners
        run: |
          set -euo pipefail
          file=".github/CODEOWNERS"
          if [[ ! -f "$file" ]]; then
            echo "::error::${file} is missing."
            exit 1
          fi

          # Unresolved ownership placeholders must be replaced with a real
          # GitHub @user or @org/team before code-owner review can be trusted.
          if grep -nE 'YOUR_GITHUB_USERNAME|REPLACE[-_]WITH|PLACEHOLDER' "$file"; then
            echo "::error file=${file}::CODEOWNERS contains unresolved ownership placeholders (listed above). Replace every '@REPLACE-WITH-GITHUB-OWNER' with the real repository owner before enabling required code-owner reviews and branch protection."
            exit 1
          fi
          echo "CODEOWNERS ownership is resolved."

      - name: Repository integrity summary
        if: always()
        env:
          FILES: ${{ steps.files.outcome }}
          DIRS: ${{ steps.dirs.outcome }}
          CONFLICTS: ${{ steps.conflicts.outcome }}
          WHITESPACE: ${{ steps.whitespace.outcome }}
          NEWLINE: ${{ steps.newline.outcome }}
          CODEOWNERS: ${{ steps.codeowners.outcome }}
        run: |
          set -euo pipefail
          # Report the real outcome of each step. A step that never ran (because
          # an earlier step failed) reports as Skipped/Not executed rather than
          # being claimed as verified.
          label() {
            case "$1" in
              success) echo "Passed" ;;
              failure) echo "Failed" ;;
              skipped) echo "Skipped" ;;
              cancelled) echo "Cancelled" ;;
              "") echo "Not executed" ;;
              *) echo "$1" ;;
            esac
          }
          {
            echo "## Repository Integrity"
            echo ""
            echo "- Required files: $(label "$FILES")"
            echo "- Required directories: $(label "$DIRS")"
            echo "- Merge conflict markers: $(label "$CONFLICTS")"
            echo "- Trailing whitespace (non-Markdown): $(label "$WHITESPACE")"
            echo "- Final newline check: $(label "$NEWLINE")"
            echo "- CODEOWNERS ownership: $(label "$CODEOWNERS")"
          } >> "$GITHUB_STEP_SUMMARY"

  structured-data:
    name: Structured Data Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check "pyyaml==6.0.2"

      - name: Validate YAML and JSON syntax
        run: |
          set -euo pipefail
          python <<'PYTHON'
          import json
          import os
          import subprocess
          import sys
          import yaml

          tracked = subprocess.run(
              ["git", "ls-files", "-z"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.split("\0")

          yaml_failures = []
          json_failures = []
          yaml_count = 0
          json_count = 0

          for name in tracked:
              if not name:
                  continue
              lower = name.lower()
              if lower.endswith((".yml", ".yaml")):
                  yaml_count += 1
                  try:
                      with open(name, "r", encoding="utf-8") as handle:
                          list(yaml.safe_load_all(handle))
                  except Exception as error:  # noqa: BLE001 - report all parse errors
                      yaml_failures.append((name, error))
              elif lower.endswith(".json"):
                  json_count += 1
                  try:
                      with open(name, "r", encoding="utf-8") as handle:
                          json.load(handle)
                  except Exception as error:  # noqa: BLE001 - report all parse errors
                      json_failures.append((name, error))

          for name, error in yaml_failures + json_failures:
              print(f"::error file={name}::{error}")

          summary = [
              "## Structured Data Validation",
              "",
              f"- YAML files parsed: {yaml_count} ({len(yaml_failures)} invalid)",
              f"- JSON files parsed: {json_count} ({len(json_failures)} invalid)",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(summary) + "\n")

          if yaml_failures or json_failures:
              sys.exit(1)

          print(f"Validated {yaml_count} YAML and {json_count} JSON files.")
          PYTHON
        env:
          PYTHONUNBUFFERED: "1"

  application-validation:
    name: Application Validation (Conditional)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect Node.js project
        id: detect
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            echo "node=true" >> "$GITHUB_OUTPUT"
            echo "A package.json was found. Application validation will run."
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
            echo "No package.json found. Application validation will be skipped."
            {
              echo "## Application Validation"
              echo ""
              echo "No Node.js project detected. Skipped."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Node.js
        if: steps.detect.outputs.node == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.detect.outputs.node == 'true'
        run: npm ci

      - name: Lint application
        if: steps.detect.outputs.node == 'true'
        run: |
          set -euo pipefail
          if npm run 2>/dev/null | grep -qE '^  lint$'; then
            npm run lint
          else
            echo "No lint script defined. Skipping."
          fi

      - name: Type-check application
        if: steps.detect.outputs.node == 'true'
        run: |
          set -euo pipefail
          if [[ -f tsconfig.json ]]; then
            npx --no-install tsc --noEmit -p tsconfig.json
          else
            echo "No tsconfig.json found. Skipping type check."
          fi

      - name: Build application
        if: steps.detect.outputs.node == 'true'
        run: |
          set -euo pipefail
          if npm run 2>/dev/null | grep -qE '^  build$'; then
            npm run build
          else
            echo "No build script defined. Skipping."
          fi

      - name: Application validation summary
        if: steps.detect.outputs.node == 'true'
        run: |
          set -euo pipefail
          {
            echo "## Application Validation"
            echo ""
            echo "- Dependencies installed with npm ci"
            echo "- Lint, type check, and build executed when defined"
          } >> "$GITHUB_STEP_SUMMARY"
